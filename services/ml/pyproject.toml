[project]
name = "stocktrading-ml"
version = "0.1.0"
description = "Local FastAPI service: yfinance ingest, indicators, FinBERT sentiment, PPO RL, vectorbt backtest."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "yfinance>=0.2.51",
    "pandas>=2.2.3",
    "numpy>=1.26.4,<2.0",
    "polars>=1.18.0",
    "duckdb>=1.1.3",
    "pyarrow>=18.1.0",
    "pandas-ta>=0.3.14b",
    "scikit-learn>=1.6.0",
    "transformers>=4.47.1",
    "torch>=2.5.1",
    "stable-baselines3>=2.4.0",
    "gymnasium>=1.0.0",
    "vectorbt>=0.27.2",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "rich>=13.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "sentiment", "rl", "backtest", "data_sources"]
